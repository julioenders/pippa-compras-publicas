services:
  - type: web
    name: pippa-compras-api
    runtime: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OBSERVATORIO_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://julioenders.github.io
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: pippa-compras-db
    plan: free
    databaseName: pippa_compras
    postgresMajorVersion: "16"
